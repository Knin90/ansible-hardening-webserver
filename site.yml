---
- name: Proyecto 1 - Servidor Web Reproducible y Hardening Base
  hosts: webservers
  become: true

  handlers:
    - name: Reiniciar SSH
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Reiniciar Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted

  tasks:
    # -------------------------------------------------------------
    # 1. HARDENING BASE DE SSH Y USUARIOS
    # -------------------------------------------------------------
    - name: Crear usuario administrador
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: sudo
        append: true
        shell: /bin/bash
        state: present

    - name: Configurar clave pública SSH para el usuario administrador
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ ssh_public_key }}"

    - name: Deshabilitar acceso root por SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Reiniciar SSH

    # -------------------------------------------------------------
    # 2. INSTALACIÓN Y CONFIGURACIÓN DE NGINX
    # -------------------------------------------------------------
    - name: Instalar paquete Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Asegurar que Nginx esté iniciado y habilitado en el arranque
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Desplegar sitio web estático usando plantilla Jinja2
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.nginx-debian.html
        owner: www-data
        group: www-data
        mode: '0644'
      notify: Reiniciar Nginx

    # -------------------------------------------------------------
    # 3. SEGURIDAD DE RED (FIREWALL UFW)
    # -------------------------------------------------------------
    - name: Permitir puertos de red en UFW (SSH y HTTP)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ ssh_port }}"
        - "{{ http_port }}"

    - name: Habilitar el firewall UFW
      community.general.ufw:
        state: enabled
